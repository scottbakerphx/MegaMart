services:
  prometheus:
    image: prom/prometheus:latest
    container_name: megamart-prometheus
    ports: ["9092:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  pushgateway:
    image: prom/pushgateway:latest
    container_name: megamart-pushgateway
    ports: ["9091:9091"]

  grafana:
    image: grafana/grafana:latest
    container_name: megamart-grafana
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin